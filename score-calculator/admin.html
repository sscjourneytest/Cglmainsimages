<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Send Notification — Mock Matrix Hub Admin</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap { max-width: 560px; margin: 0 auto; }
  .admin-wrap h1 { font-size: 1.1rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); margin: 14px 0 6px; }
  input, textarea {
    width: 100%; box-sizing: border-box; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--r-md);
    font-size: 0.9rem; font-family: inherit;
    background: var(--bg-input); color: var(--text-primary); outline: none;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  input:focus, textarea:focus { border-color: var(--ink); box-shadow: var(--glow); }
  textarea { min-height: 80px; resize: vertical; }
  .admin-send {
    width: 100%; margin-top: 20px; padding: 12px;
    background: var(--ink); color: #fff; border: none; border-radius: var(--r-md);
    font-size: 0.92rem; font-weight: 700; cursor: pointer;
    transition: background var(--dur) var(--ease);
  }
  .admin-send:hover { background: var(--ink-deep); }
  .admin-send:disabled { opacity: 0.6; }
  .status { margin-top: 14px; font-size: 0.82rem; padding: 10px 12px; border-radius: var(--r-md); display: none; }
  .status--ok { background: var(--pass-bg); color: var(--pass); display: block; }
  .status--err { background: var(--fail-bg); color: var(--fail); display: block; }
  .admin-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }
</style>
<script>try{var __mmhT=localStorage.getItem('mmh_theme');if(__mmhT==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>

<header class="screen-header">
    <div class="appbar">
        <a class="icon-btn nav-back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <img class="brand-logo-img" src="/logo.png" alt=""
                     onerror="this.outerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><rect x=&quot;3.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;3.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot; fill=&quot;currentColor&quot; stroke=&quot;none&quot;/></svg>'">
            </div>
            <div class="brand-text">
                <div class="brand-title">Mock Matrix Hub</div>
                <div class="brand-sub">Admin Console</div>
            </div>
        </div>
        <div class="appbar-actions">
            
            <button type="button" class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle theme"></button>
        </div>
    </div>
    
</header>

<div class="screen-scroll">
<main class="page-main">
  <div class="container">
  <div class="card admin-wrap">
    <h1>Send Push Notification</h1>

    <label>Admin Password</label>
    <input type="password" id="password" autocomplete="off">

    <label>Title</label>
    <input type="text" id="title" placeholder="e.g. SSC CGL Tier I Answer Key Released" maxlength="80">

    <label>Message</label>
    <textarea id="message" placeholder="e.g. The official answer key is now live. Tap to check your score."></textarea>

    <label>Page Path (optional)</label>
    <input type="text" id="path" placeholder="e.g. calculator.html?family=ssc&exam=ssc-cgl-tier1">
    <div class="admin-hint">Leave blank to open the home screen when tapped.</div>

    <button id="sendBtn" class="admin-send">Send to All Users</button>
    <div class="status" id="status"></div>
  </div>
  </div>
</main>
</div>

<script>
    /* MMH theme — shared key (mmh_theme) with the main Mock Matrix Hub app */
    const MMH_ICO_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MMH_ICO_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></svg>';
    function mmhCurrentTheme(){
        try{ const s = localStorage.getItem('mmh_theme'); if (s === 'dark' || s === 'light') return s; }catch(e){}
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function applyTheme(t){
        document.documentElement.setAttribute('data-theme', t);
        document.body.classList.toggle('dark-mode', t === 'dark');
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === 'dark' ? '#101a2e' : '#ffffff';
        const b = document.getElementById('themeBtn');
        if (b){
            b.innerHTML = t === 'dark' ? MMH_ICO_SUN : MMH_ICO_MOON;
            b.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        }
    }
    function toggleTheme(){
        const t = mmhCurrentTheme() === 'dark' ? 'light' : 'dark';
        try{ localStorage.setItem('mmh_theme', t); }catch(e){}
        applyTheme(t);
    }
    applyTheme(mmhCurrentTheme());
    (function(){ const b = document.getElementById('themeBtn'); if (b) b.addEventListener('click', toggleTheme); })();
</script>
<script>
document.getElementById('sendBtn').addEventListener('click', async () => {
  const password = document.getElementById('password').value;
  const title = document.getElementById('title').value.trim();
  const message = document.getElementById('message').value.trim();
  const path = document.getElementById('path').value.trim();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('sendBtn');

  statusEl.className = 'status';
  statusEl.textContent = '';

  if (!password || !title || !message) {
    statusEl.className = 'status status--err';
    statusEl.textContent = 'Please fill in all fields.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const res = await fetch('/api/send-notification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, title, message, path })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      statusEl.className = 'status status--ok';
      statusEl.textContent = 'Sent! Delivery to devices may take a few seconds.';
      document.getElementById('title').value = '';
      document.getElementById('message').value = '';
      document.getElementById('path').value = '';
    } else {
      statusEl.className = 'status status--err';
      statusEl.textContent = data.error || 'Send failed.';
    }
  } catch (e) {
    statusEl.className = 'status status--err';
    statusEl.textContent = 'Network error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send to All Users';
  }
});
</script>
<script src="js/appbar-fit.js"></script>
<script src="/js/capacitor.js?v=260908f"></script>
<script src="/js/app-plugins.js?v=260908f"></script>
</body>
</html>
