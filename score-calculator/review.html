<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="description" content="Review Paper — Mock Matrix Hub">
<meta name="theme-color" content="#ffffff">
<title>Review Paper — Mock Matrix Hub</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/review.css?v=2">

<!-- MathJax — renders any \( \) / $$ $$ math carried over from RRB
     source content (e.g. fraction/root formulas typed as LaTeX-ish
     text). Matches the exact config already used elsewhere in the app. -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  chtml: {
    mtextInheritFont: true,
    displayAlign: 'left',
    linebreaks: {
      allow: true,
      width: 'container',
      overflow: 'linebreak'
    }
  },
  options: {
    skipHtmlTags: ['script', 'style', 'textarea', 'pre']
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>
<body>
<script>try{var __mmhT=localStorage.getItem('mmh_theme');if(__mmhT==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>

<header class="screen-header">
    <div class="appbar">
        <button type="button" class="icon-btn nav-back" id="reviewBackBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <img class="brand-logo-img" src="/logo.png" alt=""
                     onerror="this.outerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><rect x=&quot;3.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;3.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot; fill=&quot;currentColor&quot; stroke=&quot;none&quot;/></svg>'">
            </div>
            <div class="brand-text">
                <div class="brand-title">Mock Matrix Hub</div>
                <div class="brand-sub"><span id="reviewTitle">Review Paper</span><span id="reviewSubtitle"></span></div>
            </div>
        </div>
        <div class="appbar-actions">
            <button type="button" class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle theme"></button>
        </div>
    </div>
    <div class="review-filterbar" id="reviewFilterbar"></div>
    <div class="review-sectionbar" id="reviewSectionbar"></div>
</header>

<div class="screen-scroll">

<div class="review-loading" id="reviewLoading">
  <div class="review-spinner"></div>
  Preparing your review paper…
</div>

<div class="review-error hidden" id="reviewError">
  This review session has expired or wasn't found.<br>
  Please go back and tap <b>Review Paper</b> again from your result.
</div>

<div class="review-body hidden" id="reviewRoot">
  <div id="reviewBody"></div>
</div>

<button type="button" class="review-back-btn hidden" id="reviewBackToCalcBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  Back to Score Calculator
</button>
</div>

<!-- Side palette — slides in from the right, like a test-taking app's
     question navigator. Shows numbered buttons for whichever filter is
     currently active (Wrong/Correct/Skipped/Bonus/All), colored by
     status, using the SAME qno the source HTML carries. Tapping a
     number scrolls straight to that question's card. -->
<!-- Floating question-palette toggle — bottom-right, fixed, green,
     each of the three lines prefixed with a small dot (like a bullet
     list icon rather than a plain hamburger). -->
<button type="button" class="review-fab" id="reviewPaletteBtn" aria-label="Question palette">
  <svg viewBox="0 0 24 24" fill="none">
    <circle cx="4" cy="6" r="1.6" fill="currentColor"/>
    <line x1="8" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="4" cy="12" r="1.6" fill="currentColor"/>
    <line x1="8" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="4" cy="18" r="1.6" fill="currentColor"/>
    <line x1="8" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
  </svg>
</button>

<div class="review-palette-backdrop" id="reviewPaletteBackdrop"></div>
<div class="review-palette" id="reviewPalette">
  <div class="review-palette__head">
    <span>Questions — <span id="reviewPaletteFilterLabel">Wrong</span></span>
    <button type="button" class="review-palette__close" id="reviewPaletteClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="review-palette__legend">
    <span><i class="review-dot correct"></i>Correct</span>
    <span><i class="review-dot wrong"></i>Wrong</span>
    <span><i class="review-dot skipped"></i>Skipped</span>
    <span><i class="review-dot bonus"></i>Bonus</span>
  </div>
  <div class="review-palette__grid" id="reviewPaletteGrid"></div>
</div>

<!-- Fixed bottom nav — app-like Previous/Next through the current
     filter's question list, with a "Q x of y" position indicator. -->
<div class="review-bottomnav" id="reviewBottomnav">
  <button type="button" class="review-nav-btn" id="reviewPrevBtn" aria-label="Previous question">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span>Previous</span>
  </button>
  <div class="review-nav-position" id="reviewNavPosition">1 / 1</div>
  <button type="button" class="review-nav-btn" id="reviewNextBtn" aria-label="Next question">
    <span>Next</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<script>
    /* MMH theme — shared key (mmh_theme) with the main Mock Matrix Hub app */
    const MMH_ICO_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MMH_ICO_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></svg>';
    function mmhCurrentTheme(){
        try{ const s = localStorage.getItem('mmh_theme'); if (s === 'dark' || s === 'light') return s; }catch(e){}
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function applyTheme(t){
        document.documentElement.setAttribute('data-theme', t);
        document.body.classList.toggle('dark-mode', t === 'dark');
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === 'dark' ? '#101a2e' : '#ffffff';
        const b = document.getElementById('themeBtn');
        if (b){
            b.innerHTML = t === 'dark' ? MMH_ICO_SUN : MMH_ICO_MOON;
            b.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        }
    }
    function toggleTheme(){
        const t = mmhCurrentTheme() === 'dark' ? 'light' : 'dark';
        try{ localStorage.setItem('mmh_theme', t); }catch(e){}
        applyTheme(t);
    }
    applyTheme(mmhCurrentTheme());
    (function(){ const b = document.getElementById('themeBtn'); if (b) b.addEventListener('click', toggleTheme); })();
</script>
<script src="js/remote-loader.js?v=1"></script>
<script>
  // Same as calculator.html: every app script goes through RSMLoader,
  // not a plain <script src> tag — otherwise this page would never
  // pick up a pushed update to review.js / review-json-builder.js,
  // only whatever was bundled at install time. Loaded in order so
  // review.js can rely on RSMReviewBuilder already being defined.
  RSMLoader.loadScripts([
    { path: 'js/review-json-builder.js', local: 'js/review-json-builder.js?v=1' },
    { path: 'js/review.js',              local: 'js/review.js?v=1' }
  ]);
</script>
<script src="js/appbar-fit.js"></script>
<script src="/js/capacitor.js?v=260908f"></script>
<script src="/js/app-plugins.js?v=260908f"></script>
</body>
</html>
