<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifications — Mock Matrix Hub</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
#notifList { display: flex; flex-direction: column; gap: 10px; }
.notif-item {
  display: block; padding: 14px 16px;
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--bg-input); text-decoration: none;
  transition: border-color .15s ease, transform .12s ease;
  animation: fadeUp .35s var(--ease) both;
}
.notif-item:hover { border-color: var(--border-strong); }
.notif-item:active { transform: scale(.99); }
.notif-item--unread { background: var(--primary-soft); border-color: var(--ink); }
.notif-item__title { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
.notif-item__body { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
.notif-item__time { font-size: 0.68rem; color: var(--text-muted); margin-top: 4px; }
.notif-empty { text-align: center; padding: var(--sp-8) var(--sp-4); color: var(--text-muted); font-size: 0.82rem; }
@media (min-width: 1100px) {
  #notifList { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .notif-empty { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<script>try{var __mmhT=localStorage.getItem('mmh_theme');if(__mmhT==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>

<header class="screen-header">
    <div class="appbar">
        <a class="icon-btn nav-back" href="index.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <img class="brand-logo-img" src="/logo.png" alt=""
                     onerror="this.outerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><rect x=&quot;3.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;3.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot; fill=&quot;currentColor&quot; stroke=&quot;none&quot;/></svg>'">
            </div>
            <div class="brand-text">
                <div class="brand-title">Mock Matrix Hub</div>
                <div class="brand-sub">Notifications</div>
            </div>
        </div>
        <div class="appbar-actions">
            
            <button type="button" class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle theme"></button>
        </div>
    </div>
    
</header>

<div class="screen-scroll">
<main class="page-main">
  <div class="container">
    <div class="card fade-up fade-up-1">
      <div id="notifList"></div>
    </div>
  </div>
</main>
</div>

<script>
    /* MMH theme — shared key (mmh_theme) with the main Mock Matrix Hub app */
    const MMH_ICO_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MMH_ICO_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></svg>';
    function mmhCurrentTheme(){
        try{ const s = localStorage.getItem('mmh_theme'); if (s === 'dark' || s === 'light') return s; }catch(e){}
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function applyTheme(t){
        document.documentElement.setAttribute('data-theme', t);
        document.body.classList.toggle('dark-mode', t === 'dark');
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === 'dark' ? '#101a2e' : '#ffffff';
        const b = document.getElementById('themeBtn');
        if (b){
            b.innerHTML = t === 'dark' ? MMH_ICO_SUN : MMH_ICO_MOON;
            b.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        }
    }
    function toggleTheme(){
        const t = mmhCurrentTheme() === 'dark' ? 'light' : 'dark';
        try{ localStorage.setItem('mmh_theme', t); }catch(e){}
        applyTheme(t);
    }
    applyTheme(mmhCurrentTheme());
    (function(){ const b = document.getElementById('themeBtn'); if (b) b.addEventListener('click', toggleTheme); })();
</script>
<script src="js/push-notifications.js"></script>
<script>
function render() {
  var list = (window.RSMNotif ? RSMNotif.getHistory() : []);
  var container = document.getElementById('notifList');

  if (!list.length) {
    container.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
    return;
  }

  container.innerHTML = list.map(function (n) {
    var dt = n.sentAt ? new Date(n.sentAt) : null;
    var timeStr = dt ? dt.toLocaleString() : '';
    var target = (n.path && n.path.trim()) ? n.path.trim() : 'index.html';
    return '<a href="' + target + '" class="notif-item ' + (n.read ? '' : 'notif-item--unread') + '">' +
      '<div class="notif-item__title">' + escapeHtml(n.title) + '</div>' +
      '<div class="notif-item__body">' + escapeHtml(n.body) + '</div>' +
      '<div class="notif-item__time">' + timeStr + '</div>' +
      '</a>';
  }).join('');
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

render();
if (window.RSMNotif) RSMNotif.markAllRead();
</script>
<script src="js/appbar-fit.js"></script>
<script src="/js/capacitor.js?v=260908f"></script>
<script src="/js/app-plugins.js?v=260908f"></script>
</body>
</html>
