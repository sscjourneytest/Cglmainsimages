<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifications | Mock Matrix Hub</title>
<meta name="theme-color" content="#f3f5fb">
<script>
    /* early theme apply — same mmh_theme key + meta values the common shell uses */
    (function(){ try{
        var t = localStorage.getItem('mmh_theme');
        if (t !== 'light' && t !== 'dark'){
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        window.__mmhTheme = t;
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === 'dark' ? '#0a0f1e' : '#f3f5fb';
    }catch(e){}})();
</script>
<style>

/* ── Site tokens (same palette as the rest of the site) ───────────────── */
:root{
    --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f8fafc;
    --border:#e5eaf3; --border-strong:#d6deeb;
    --text:#0b1220; --text-2:#41506b; --text-3:#7c8aa5;
    --primary:#3d5afe; --primary-2:#2b44d8; --primary-soft:rgba(61,90,254,.10);
    --grad-primary:linear-gradient(135deg,#4d6bff 0%,#2b44d8 100%);
    --emerald:#0ea371; --emerald-soft:rgba(14,163,113,.12);
    --amber:#b45309; --amber-soft:rgba(245,158,11,.14);
    --red:#dc2643; --red-soft:rgba(225,29,72,.10);
    --shadow-card:0 1px 2px rgba(15,23,42,.04), 0 10px 26px -14px rgba(15,23,42,.14);
}
body.dark-mode{
    --bg:#0a0f1e; --surface:#101a2e; --surface-2:#16233c;
    --border:#22304b; --border-strong:#2e4062;
    --text:#eaf0fb; --text-2:#b9c6dd; --text-3:#8494b0;
    --primary:#6d81ff; --primary-2:#5468f0; --primary-soft:rgba(109,129,255,.16);
    --emerald:#34d399; --emerald-soft:rgba(52,211,153,.14);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,.14);
    --red:#fb7185; --red-soft:rgba(251,113,133,.14);
    --shadow-card:0 1px 2px rgba(0,0,0,.35), 0 14px 30px -16px rgba(0,0,0,.6);
}
*{ box-sizing:border-box; }
@media (prefers-reduced-motion:reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
html{ background:var(--bg); }
html, body{ height:100%; }
/* Locked app frame — identical to home / exams / mock hub: body never
   scrolls, only .screen-scroll does, so the header cannot move at all. */
body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    font-size:14.5px; line-height:1.55;
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    overflow:hidden;
    transition:background-color .3s ease, color .3s ease;
    -webkit-tap-highlight-color:transparent;
}
.screen-scroll{
    flex:1; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
}

/* ── Appbar header (verbatim site system) ─────────────────────────────── */
.screen-header{
    flex-shrink:0;
    /* blend with page: same bg token as body, no divider line */
    background:var(--bg);
    border-bottom:none;
    padding-top:env(safe-area-inset-top, 0px);
}
.appbar{ display:flex; align-items:center; gap:10px; padding:9px 16px 10px; }
.icon-btn{
    width:38px; height:38px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-2);
    display:grid; place-items:center; cursor:pointer; padding:0; flex-shrink:0;
    text-decoration:none;
    transition:transform .12s ease, color .15s ease, border-color .15s ease, background .15s ease;
}
.icon-btn svg{ width:18px; height:18px; }
.icon-btn:hover{ color:var(--primary); border-color:var(--border-strong); }
.icon-btn:active{ transform:scale(.9); }
.nav-back{ width:38px; height:38px; border-radius:12px; flex-shrink:0; }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark{
    width:37px; height:37px; border-radius:11px;
    background:var(--grad-primary);
    display:grid; place-items:center; color:#fff; flex-shrink:0;
    box-shadow:0 5px 14px rgba(61,90,254,.35);
    overflow:hidden;
}
.brand-logo-img{ width:100%; height:100%; object-fit:cover; border-radius:11px; display:block; background:var(--surface-2); }
.brand-mark svg{ width:19px; height:19px; }
.brand-text{ min-width:0; }
.brand-title{
    font-size:16px; font-weight:700; letter-spacing:-.2px; line-height:1.2;
    color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:clip;
}
.brand-sub{
    margin-top:1px; font-size:10px; font-weight:700; letter-spacing:.9px;
    text-transform:uppercase; color:var(--text-3); white-space:nowrap;
}
.appbar-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.chip-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--primary);
    font:inherit; font-size:11.5px; font-weight:800; letter-spacing:.3px;
    padding:8px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
    transition:background .15s ease, color .15s ease, transform .12s ease;
}
.chip-btn:active{ transform:scale(.94); }
.chip-btn:hover{ background:var(--primary-soft); }

/* ── Wide page wrap — spreads on every screen, no max-width card ──────── */
.pg-wrap{
    width:100%; max-width:100%;
    padding:22px clamp(14px, 2.6vw, 34px) calc(40px + env(safe-area-inset-bottom));
}
@media (min-width:760px){
    body{
        background:
            radial-gradient(circle at 12% 8%, var(--primary-soft), transparent 44%),
            radial-gradient(circle at 88% 92%, var(--emerald-soft), transparent 40%),
            var(--bg);
    }
}

/* ── Hero band ────────────────────────────────────────────────────────── */
.pg-hero{
    position:relative; overflow:hidden;
    background:var(--grad-primary); color:#fff;
    border-radius:20px;
    padding:clamp(22px, 3vw, 36px) clamp(20px, 2.6vw, 34px);
    box-shadow:0 14px 34px -14px rgba(43,68,216,.55);
    animation:pg-up .5s cubic-bezier(.22,.9,.3,1) both;
}
.pg-hero::after{
    content:''; position:absolute; top:-80px; right:-60px;
    width:220px; height:220px; border-radius:50%;
    background:rgba(255,255,255,.08); pointer-events:none;
}
.pg-hero .eyebrow{
    font-family:ui-monospace, 'JetBrains Mono', Menlo, monospace;
    font-size:10.5px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase;
    color:rgba(255,255,255,.72);
}
.pg-hero h1{
    margin:8px 0 6px; font-size:clamp(1.35rem, 3vw, 2rem); font-weight:800; letter-spacing:-.4px;
}
.pg-hero p{ margin:0; font-size:13.5px; color:rgba(255,255,255,.85); max-width:70ch; }
.pg-hero .hero-ico{
    position:absolute; right:clamp(16px, 3vw, 34px); top:50%; transform:translateY(-50%);
    width:64px; height:64px; border-radius:18px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3);
    display:grid; place-items:center;
}
.pg-hero .hero-ico svg{ width:30px; height:30px; }
@media (max-width:640px){ .pg-hero .hero-ico{ display:none; } }

/* ── Content cards / sections ─────────────────────────────────────────── */
.pg-cols{ display:grid; gap:16px; grid-template-columns:1fr; margin-top:18px; }
@media (min-width:1100px){ .pg-cols{ grid-template-columns:1fr 1fr; align-items:start; } }
.pg-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:clamp(16px, 2.2vw, 26px);
    box-shadow:var(--shadow-card);
    animation:pg-up .45s cubic-bezier(.22,.9,.3,1) both;
}
.pg-card + .pg-card{ animation-delay:.06s; }
.pg-sec + .pg-sec{ margin-top:20px; padding-top:20px; border-top:1px dashed var(--border); }
.pg-sec h4{
    margin:0 0 8px; font-size:15px; font-weight:800; letter-spacing:-.2px; color:var(--text);
    display:flex; align-items:center; gap:9px;
}
.pg-sec h4 .si{
    width:28px; height:28px; border-radius:9px; flex-shrink:0;
    background:var(--primary-soft); color:var(--primary);
    display:grid; place-items:center;
}
.pg-sec h4 .si svg{ width:14px; height:14px; }
.pg-sec p{ margin:0 0 8px; color:var(--text-2); font-size:13.5px; }
.pg-sec ul{ margin:6px 0 4px; padding-left:2px; list-style:none; }
.pg-sec ul li{
    position:relative; padding-left:20px; margin-bottom:7px;
    color:var(--text-2); font-size:13.5px;
}
.pg-sec ul li::before{
    content:''; position:absolute; left:2px; top:8px;
    width:7px; height:7px; border-radius:50%;
    background:var(--primary); opacity:.75;
}
.callout{
    display:flex; gap:10px; align-items:flex-start;
    border-radius:14px; padding:12px 14px; margin-top:12px;
    font-size:12.5px; font-weight:600; line-height:1.5;
    animation:pg-up .45s .1s cubic-bezier(.22,.9,.3,1) both;
}
.callout svg{ width:16px; height:16px; flex-shrink:0; margin-top:2px; }
.callout.danger{ background:var(--red-soft); color:var(--red); border:1px dashed var(--red); }
.callout.warn{ background:var(--amber-soft); color:var(--amber); border:1px dashed var(--amber); }
.callout.safe{ background:var(--emerald-soft); color:var(--emerald); border:1px dashed var(--emerald); }
.faq-item{
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
    padding:12px 14px; margin-bottom:10px;
    animation:pg-up .4s both;
}
.faq-item .faq-q{ margin:0 0 5px; font-size:13px; font-weight:800; color:var(--text); }
.faq-item .faq-a{ margin:0; font-size:12.5px; color:var(--text-2); }
.pg-foot{
    margin-top:22px; text-align:center;
    font-family:ui-monospace, 'JetBrains Mono', Menlo, monospace;
    font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--text-3);
    animation:pg-up .5s .12s both;
}

/* ── Contact grid ─────────────────────────────────────────────────────── */
.info-grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
.info-item{
    display:flex; gap:13px; align-items:flex-start;
    background:var(--surface-2); border:1px solid var(--border); border-radius:16px;
    padding:15px 16px;
    animation:pg-up .45s both;
}
.info-item:nth-child(2){ animation-delay:.05s; }
.info-item:nth-child(3){ animation-delay:.1s; }
.info-item:nth-child(4){ animation-delay:.15s; }
.icon-box{
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    background:var(--primary-soft); color:var(--primary);
    display:grid; place-items:center;
}
.icon-box svg{ width:18px; height:18px; }
.info-content h5{ margin:1px 0 3px; font-size:13.5px; font-weight:800; color:var(--text); }
.info-content p, .info-content a{ margin:0; font-size:12.5px; color:var(--text-2); text-decoration:none; overflow-wrap:anywhere; }
.info-content a{ color:var(--primary); font-weight:700; }
.support-btn{
    display:inline-flex; align-items:center; gap:9px;
    background:var(--grad-primary); color:#fff; text-decoration:none;
    font-size:13px; font-weight:800; letter-spacing:.2px;
    padding:12px 20px; border-radius:999px; margin-top:6px;
    box-shadow:0 10px 24px -8px rgba(43,68,216,.55);
    transition:transform .12s ease, box-shadow .15s ease;
    animation:pg-up .5s .1s both;
}
.support-btn svg{ width:16px; height:16px; }
.support-btn:active{ transform:scale(.96); }

/* ── About extras ─────────────────────────────────────────────────────── */
.feature-grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); margin-top:16px; }
.feature-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:16px;
    padding:18px 16px; text-align:center;
    animation:pg-up .45s both;
}
.feature-box:nth-child(2){ animation-delay:.06s; }
.feature-box:nth-child(3){ animation-delay:.12s; }
.feature-icon{
    width:44px; height:44px; border-radius:14px; margin:0 auto 10px;
    background:var(--primary-soft); color:var(--primary);
    display:grid; place-items:center;
}
.feature-icon svg{ width:20px; height:20px; }
.feature-box h5{ margin:0 0 5px; font-size:13.5px; font-weight:800; color:var(--text); }
.feature-box p{ margin:0; font-size:12.5px; color:var(--text-2); }

/* ── Notifications ────────────────────────────────────────────────────── */
.notif-list{ display:grid; gap:10px; grid-template-columns:1fr; margin-top:16px; }
@media (min-width:1100px){ .notif-list{ grid-template-columns:1fr 1fr; } }
.date-group-label{
    grid-column:1 / -1;
    font-family:ui-monospace, 'JetBrains Mono', Menlo, monospace;
    font-size:10.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--text-3); margin:8px 2px 0;
}
.notif-card{
    position:relative; overflow:hidden;
    display:flex; gap:12px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:14px 15px; text-decoration:none;
    box-shadow:var(--shadow-card);
    animation:pg-up .4s cubic-bezier(.22,.9,.3,1) both;
    transition:transform .12s ease, border-color .15s ease;
}
.notif-card:active{ transform:scale(.985); }
.notif-card:hover{ border-color:var(--border-strong); }
.notif-card.unread{ background:linear-gradient(135deg, var(--primary-soft) 0%, var(--surface) 72%); }
.notif-card.unread::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--primary);
}
.notif-icon{
    width:40px; height:40px; border-radius:12px; flex-shrink:0;
    background:var(--primary-soft); color:var(--primary);
    display:grid; place-items:center;
}
.notif-icon svg{ width:17px; height:17px; }
.notif-card.unread .notif-icon{ background:var(--grad-primary); color:#fff; box-shadow:0 4px 10px rgba(61,90,254,.35); }
.notif-body{ flex:1; min-width:0; }
.notif-title{
    font-weight:800; font-size:13px; margin-bottom:3px; color:var(--text);
    display:flex; align-items:center; gap:6px;
}
.unread-dot{ width:7px; height:7px; background:var(--red); border-radius:50%; flex-shrink:0; }
.notif-text{ font-size:12.5px; color:var(--text-2); line-height:1.45; }
.notif-time{
    font-size:11px; color:var(--text-3); margin-top:6px;
    display:flex; align-items:center; gap:5px;
}
.notif-time svg{ width:11px; height:11px; }
.load-more-btn{
    grid-column:1 / -1;
    background:var(--surface); border:1.5px solid var(--border);
    color:var(--primary); font:inherit; font-weight:800; font-size:13px;
    padding:13px; border-radius:14px; cursor:pointer;
    transition:background .15s ease, transform .12s ease;
}
.load-more-btn:active{ transform:scale(.98); }
.load-more-btn:disabled{ opacity:.5; }
.empty-state{ grid-column:1 / -1; text-align:center; padding:60px 20px; color:var(--text-3); animation:pg-up .45s both; }
.empty-state .empty-icon{
    width:72px; height:72px; border-radius:20px; margin:0 auto 14px;
    background:var(--primary-soft); color:var(--primary);
    display:grid; place-items:center;
}
.empty-state .empty-icon svg{ width:30px; height:30px; }
.empty-state h3{ font-size:15px; font-weight:800; color:var(--text); margin:0 0 4px; }
.empty-state p{ font-size:12.5px; margin:0; }
.skeleton{
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; height:78px; position:relative; overflow:hidden;
}
.skeleton::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(148,163,184,.18), transparent);
    animation:shimmer 1.4s infinite;
}
@keyframes shimmer{ from{ transform:translateX(-100%); } to{ transform:translateX(100%); } }

@keyframes pg-up{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
</style>
</head>
<body>
<script>
    try{ if ((window.__mmhTheme || 'light') === 'dark') document.body.classList.add('dark-mode'); }catch(e){}
</script>

<header class="screen-header">
    <div class="appbar">
        <a class="icon-btn nav-back" href="/" aria-label="Back to home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <img class="brand-logo-img" src="/logo.png" alt=""
                     onerror="this.outerHTML='<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><rect x=&quot;3.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;3.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;3.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot;/><rect x=&quot;13.2&quot; y=&quot;13.2&quot; width=&quot;7.6&quot; height=&quot;7.6&quot; rx=&quot;2.2&quot; fill=&quot;currentColor&quot; stroke=&quot;none&quot;/></svg>'">
            </div>
            <div class="brand-text">
                <div class="brand-title">Mock Matrix Hub</div>
                <div class="brand-sub">Notifications</div>
            </div>
        </div>
        <div class="appbar-actions"><button type="button" class="chip-btn" id="markAllBtn">Mark all read</button>
            <button type="button" class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle theme"></button>
        </div>
    </div>
</header>

<main class="screen-scroll">
<div class="pg-wrap">
    <div class="notif-list" id="notifList">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>
    <div class="notif-list" style="margin-top:10px;">
        <button class="load-more-btn" id="loadMoreBtn" style="display:none;" onclick="loadNotifications(false)">Load More</button>
    </div>
</div>
</main>

<script>
    /* Theme — parity with the common shell (mmh_theme, sun/moon, meta) */
    const ICO_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const ICO_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a7 7 0 0 0 9.7 9.7z"/></svg>';
    function currentTheme(){
        try{
            const s = localStorage.getItem('mmh_theme');
            if (s === 'dark' || s === 'light') return s;
        }catch(e){}
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function applyTheme(t){
        document.body.classList.toggle('dark-mode', t === 'dark');
        document.documentElement.setAttribute('data-theme', t);
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === 'dark' ? '#0a0f1e' : '#f3f5fb';
        const b = document.getElementById('themeBtn');
        if (b){
            b.innerHTML = t === 'dark' ? ICO_SUN : ICO_MOON;
            b.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
        }
    }
    function toggleTheme(){
        const t = currentTheme() === 'dark' ? 'light' : 'dark';
        try{ localStorage.setItem('mmh_theme', t); }catch(e){}
        applyTheme(t);
    }
    document.addEventListener('DOMContentLoaded', () => {
        applyTheme(currentTheme());
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
    });

    // ── Notifications logic (unchanged behaviour, restyled shell) ──
    const NOTIFY_API_BASE = 'https://mmh-notify-worker.mockmatrixsupport.workers.dev';
    const PAGE_SIZE = 10;

    let oldestLoadedId = null;
    let lastSeenIdAtPageLoad = parseInt(localStorage.getItem('mmh_last_seen_notif_id') || '0', 10);
    let newestIdSeenThisSession = lastSeenIdAtPageLoad;

    const ICO_BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9.2a6 6 0 1 0-12 0c0 5-2 6.3-2 6.3h16s-2-1.3-2-6.3"/><path d="M10.3 19.2a2 2 0 0 0 3.4 0"/></svg>';
    const ICO_BELL_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9.2a6 6 0 0 0-9.7-4.7M6 9.2c0 5-2 6.3-2 6.3h12M10.3 19.2a2 2 0 0 0 3.4 0"/><path d="M4 4l16 16"/></svg>';
    const ICO_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
    const ICO_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>';

    // Worker stores created_at as an ISO string; older rows may be unix seconds.
    // Accept both so the page never shows "Invalid Date".
    function parseWhen(v){
        if (typeof v === 'number') return v > 1e12 ? v : v * 1000;
        const t = Date.parse(v);
        return isNaN(t) ? Date.now() : t;
    }

    function timeAgo(createdAt){
        const ms = parseWhen(createdAt);
        const diffMs = Date.now() - ms;
        const mins = Math.floor(diffMs / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + 'm ago';
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h ago';
        const days = Math.floor(hours / 24);
        if (days < 7) return days + 'd ago';
        return new Date(ms).toLocaleDateString();
    }

    function dateGroupLabel(createdAt){
        const d = new Date(parseWhen(createdAt));
        const today = new Date();
        const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
        const sameDay = (a, b) => a.toDateString() === b.toDateString();
        if (sameDay(d, today)) return 'Today';
        if (sameDay(d, yesterday)) return 'Yesterday';
        return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
    }

    function escapeHtml(str){
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    function renderNotification(n){
        const isUnread = n.id > lastSeenIdAtPageLoad;
        if (n.id > newestIdSeenThisSession) newestIdSeenThisSession = n.id;
        const card = document.createElement('a');
        card.href = n.url || '#';
        card.className = 'notif-card' + (isUnread ? ' unread' : '');
        card.innerHTML = `
            <div class="notif-icon">${ICO_BELL}</div>
            <div class="notif-body">
                <div class="notif-title">${isUnread ? '<span class="unread-dot"></span>' : ''}${escapeHtml(n.title)}</div>
                <div class="notif-text">${escapeHtml(n.body)}</div>
                <div class="notif-time">${ICO_CLOCK} ${timeAgo(n.created_at)}</div>
            </div>
        `;
        return card;
    }

    async function loadNotifications(isFirstLoad){
        const listEl = document.getElementById('notifList');
        const btn = document.getElementById('loadMoreBtn');

        if (isFirstLoad){
            listEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
        } else {
            btn.disabled = true;
            btn.textContent = 'Loading...';
        }

        try{
            let url = `${NOTIFY_API_BASE}/api/notify/list?limit=${PAGE_SIZE}`;
            if (!isFirstLoad && oldestLoadedId) url += `&before_id=${oldestLoadedId}`;

            const res = await fetch(url);
            const data = await res.json();
            const list = data.notifications || [];

            if (isFirstLoad) listEl.innerHTML = '';

            if (list.length === 0 && isFirstLoad){
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">${ICO_BELL_OFF}</div>
                        <h3>No notifications yet</h3>
                        <p>We'll let you know when something important comes up.</p>
                    </div>`;
                btn.style.display = 'none';
                return;
            }

            let lastGroupLabel = null;
            if (!isFirstLoad){
                const existingLabels = listEl.querySelectorAll('.date-group-label');
                if (existingLabels.length > 0) lastGroupLabel = existingLabels[existingLabels.length - 1].textContent;
            }

            list.forEach(n => {
                const label = dateGroupLabel(n.created_at);
                if (label !== lastGroupLabel){
                    const groupEl = document.createElement('div');
                    groupEl.className = 'date-group-label';
                    groupEl.textContent = label;
                    listEl.appendChild(groupEl);
                    lastGroupLabel = label;
                }
                listEl.appendChild(renderNotification(n));
                oldestLoadedId = n.id;
            });

            btn.style.display = data.hasMore ? 'block' : 'none';
            btn.disabled = false;
            btn.textContent = 'Load More';

            if (newestIdSeenThisSession > 0){
                localStorage.setItem('mmh_last_seen_notif_id', String(newestIdSeenThisSession));
            }
        } catch (err){
            console.error('Failed to load notifications:', err);
            if (isFirstLoad){
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">${ICO_WARN}</div>
                        <h3>Couldn't load notifications</h3>
                        <p>Pull to refresh or check your connection.</p>
                    </div>`;
            } else {
                btn.disabled = false;
                btn.textContent = 'Load More';
            }
        }
    }

    document.getElementById('markAllBtn').addEventListener('click', () => {
        if (newestIdSeenThisSession > 0){
            localStorage.setItem('mmh_last_seen_notif_id', String(newestIdSeenThisSession));
        }
        document.querySelectorAll('.notif-card.unread').forEach(card => {
            card.classList.remove('unread');
            const dot = card.querySelector('.unread-dot');
            if (dot) dot.remove();
        });
    });

    loadNotifications(true);
</script>
